<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MultiParty - Realtime Arena</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #07020d; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }

        #lobby-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #160826 0%, #07020d 100%);
            z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 15px; overflow-y: auto;
        }
        
        .lobby-card {
            background: rgba(20, 8, 33, 0.85); border: 2px solid #63e4e4; border-radius: 16px;
            padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 0 20px rgba(99, 228, 228, 0.2);
            display: flex; flex-direction: column; gap: 14px; backdrop-filter: blur(5px);
        }

        h1 { color: #63e4e4; font-size: 28px; text-align: center; text-shadow: 0 0 12px rgba(99, 228, 228, 0.6); letter-spacing: 2px; margin-bottom: 2px; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; color: #a5f3f3; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="text"], select {
            width: 100%; padding: 12px; font-size: 15px; border-radius: 8px; border: 1px solid #4a2e6b;
            background: #0d0414; color: #fff; outline: none; transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus { border-color: #63e4e4; box-shadow: 0 0 8px rgba(99, 228, 228, 0.3); }

        .checkbox-container {
            display: flex; flex-direction: column; gap: 8px; background: rgba(13, 4, 20, 0.6);
            padding: 10px 12px; border-radius: 8px; border: 1px solid #33154f;
        }
        .checkbox-container label {
            display: flex; align-items: center; gap: 10px; font-size: 13px; color: #e2d9f3;
            font-weight: normal; text-transform: none; cursor: pointer;
        }
        .checkbox-container input[type="checkbox"] { width: 18px; height: 18px; accent-color: #63e4e4; cursor: pointer; }

        .btn-container { display: flex; gap: 10px; width: 100%; max-width: 380px; margin-top: 10px; }
        .btn-main {
            flex: 1; padding: 14px; font-size: 14px; font-weight: bold; border-radius: 10px; border: none;
            background: #63e4e4; color: #07020d; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(99, 228, 228, 0.3); transition: transform 0.1s, background 0.2s;
        }
        .btn-main:active { transform: scale(0.97); }
        .btn-join { background: #00ffaa; color: #07020d; box-shadow: 0 4px 10px rgba(0, 255, 170, 0.3); }
        .btn-start { background: #ffea00; color: #07020d; width: 100%; max-width: 380px; margin-top: 8px; display: none; }
        .btn-exit { background: #ff3366; color: #fff; width: 100%; max-width: 380px; margin-top: 8px; box-shadow: 0 4px 10px rgba(255, 51, 102, 0.3); }

        canvas { display: block; background: linear-gradient(180deg, #160826 0%, #07020d 100%); }
        #ui {
            position: absolute; top: 15px; left: 15px; pointer-events: none;
            display: flex; flex-direction: column; gap: 4px; font-size: 13px; z-index: 5;
            background: rgba(7, 2, 13, 0.7); padding: 8px 12px; border-radius: 8px; border: 1px solid #33154f;
        }
        #event-banner {
            position: absolute; top: 15px; width: 100%; text-align: center;
            color: #ffea00; font-size: 18px; font-weight: bold; pointer-events: none; z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        #music-info {
            position: absolute; bottom: 90px; left: 20px; font-size: 11px; color: #a5f3f3;
            background: rgba(13, 4, 20, 0.7); padding: 5px 10px; border-radius: 6px; z-index: 5;
            border: 1px solid #33154f; pointer-events: none;
        }
        .touch-controls {
            position: absolute; bottom: 20px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 5;
        }
        .d-pad, .action-pad { display: flex; gap: 15px; pointer-events: auto; }
        .ctrl-btn {
            width: 65px; height: 65px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
            color: white; font-size: 22px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; touch-action: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="lobby-overlay">
        <h1>MULTIPARTY</h1>
        
        <div class="lobby-card">
            <div class="input-group">
                <label>Tu Apodo:</label>
                <input type="text" id="player-name" placeholder="Escribe tu apodo..." maxlength="12" value="Jugador1">
            </div>

            <div class="input-group">
                <label>Tipo de Sala:</label>
                <select id="room-type">
                    <option value="public">Pública</option>
                    <option value="private">Privada (Con código)</option>
                </select>
            </div>

            <div class="input-group" id="code-group" style="display:none;">
                <label>Código de Sala (4 cifras):</label>
                <input type="text" id="room-code-input" placeholder="Ej. 8237" maxlength="4">
            </div>

            <div class="input-group">
                <label>Límite de Jugadores:</label>
                <select id="max-players">
                    <option value="2">2 Jugadores</option>
                    <option value="3">3 Jugadores</option>
                    <option value="4">4 Jugadores</option>
                    <option value="5">5 Jugadores</option>
                    <option value="6" selected>6 Jugadores</option>
                </select>
            </div>

            <div class="checkbox-container">
                <label><input type="checkbox" id="chk-bots" checked> Rellenar con Bots si faltan jugadores</label>
                <label><input type="checkbox" id="chk-chaos" checked> ¡Eventos Caóticos (Duración 20s)!</label>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn-main" id="btn-create">Crear Sala</button>
            <button class="btn-main btn-join" id="btn-join">Unirse</button>
        </div>
        <button class="btn-main btn-start" id="btn-start-game">▶ Comenzar Partida Ya</button>
        <button class="btn-main btn-exit" id="btn-exit-lobby" style="display:none;">Salir de la Sala</button>
    </div>

    <div id="ui">
        <div>SALA: <span id="display-room" style="color: #63e4e4;">---</span> | JUGADORES: <span id="player-count">1</span>/<span id="display-max">6</span></div>
        <div>ESTADO: <span id="timer" style="color: #00ffaa;">3</span>s</div>
    </div>
    <div id="event-banner">CONFIGURA TU PARTIDA</div>
    <div id="music-info">♪ BGM: Tobu Playlist</div>

    <canvas id="gameCanvas"></canvas>

    <!-- Elemento de audio dinámico para la música -->
    <audio id="game-audio"></audio>

    <div class="touch-controls">
        <div class="d-pad">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="action-pad">
            <div class="ctrl-btn" id="btn-jump" style="background: rgba(99, 228, 228, 0.25); border-color: #63e4e4;">▲</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCkm6LCxuYOvAW5VtpuLwrAtVAVWmgdgTA",
            authDomain: "superweb-26a73.firebaseapp.com",
            databaseURL: "https://superweb-26a73-default-rtdb.firebaseio.com",
            projectId: "superweb-26a73",
            storageBucket: "superweb-26a73.firebasestorage.app",
            messagingSenderId: "383070834112",
            appId: "1:383070834112:web:e74d1697cf9902d7bc0c25"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- PLAYLIST DE TOBU Y NCS ---
        const playlist = [
            { name: "Tobu - Candyland", src: "https://ncsprod.s3.amazonaws.com/tracks/115/preview.mp3" },
            { name: "Tobu - Cloud 9", src: "https://ncsprod.s3.amazonaws.com/tracks/27/preview.mp3" },
            { name: "Tobu - Sunburst", src: "https://ncsprod.s3.amazonaws.com/tracks/178/preview.mp3" },
            { name: "Tobu - Infectious", src: "https://ncsprod.s3.amazonaws.com/tracks/92/preview.mp3" },
            { name: "Tobu - Roots", src: "https://ncsprod.s3.amazonaws.com/tracks/434/preview.mp3" },
            { name: "Tobu - Hope", src: "https://ncsprod.s3.amazonaws.com/tracks/83/preview.mp3" },
            { name: "Tobu - Life", src: "https://ncsprod.s3.amazonaws.com/tracks/149/preview.mp3" },
            { name: "Tobu - Fantasy", src: "https://ncsprod.s3.amazonaws.com/tracks/114/preview.mp3" }
        ];

        let currentTrackIndex = 0;
        const audioElement = document.getElementById('game-audio');
        audioElement.volume = 0.35; // Volumen agradable

        function playPlaylist() {
            if (playlist.length === 0) return;
            const track = playlist[currentTrackIndex];
            audioElement.src = track.src;
            document.getElementById('music-info').innerText = "♪ BGM: " + track.name;
            
            audioElement.play().catch(e => console.log("Audio bloqueado hasta interacción"));

            // Al terminar una canción, pasa automáticamente a la siguiente de la lista
            audioElement.onended = () => {
                currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
                playPlaylist();
            };
        }

        const badWords = ["puta", "mierda", "estupido", "estúpida", "pendejo", "pendeja", "puto", "carajo", "bastardo", "bitch", "fuck", "asshole"];
        function filterText(text) {
            let cleanText = text;
            badWords.forEach(word => {
                const regex = new RegExp(word, "gi");
                cleanText = cleanText.replace(regex, "***");
            });
            return cleanText;
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let roomId = null;
        let playerId = null;
        let remotePlayers = {};
        let chaosInterval = null;
        let gameStarted = false;
        let startTimerInterval = null;

        let activeEvent = null;
        let cubeSize = 40;
        let laserX = -100;
        let botList = {};

        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        const GROUND_Y = canvas.height - 80;
        const player = {
            x: 100, y: GROUND_Y - 40, size: 40,
            velocityX: 0, velocityY: 0, speed: 6, acceleration: 0.9,
            friction: 0.82, gravity: 1.0, jumpForce: -20, isGrounded: false,
            color: '#63e4e4', name: 'Jugador'
        };

        const input = { left: false, right: false, jump: false };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') input.jump = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') input.jump = false;
        });

        document.getElementById('room-type').addEventListener('change', (e) => {
            const isPrivate = e.target.value === 'private';
            document.getElementById('code-group').style.display = isPrivate ? 'flex' : 'none';
        });

        document.getElementById('btn-create').addEventListener('click', () => {
            playPlaylist(); // Inicia la música de Tobu al crear sala
            const type = document.getElementById('room-type').value;
            let code = type === 'private' 
                ? Math.floor(1000 + Math.random() * 9000).toString() 
                : 'PUB' + Math.floor(100 + Math.random() * 900);
            
            joinRoom(code, true);
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            playPlaylist(); // Inicia la música de Tobu al unirse a sala
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if (code) joinRoom(code, false);
        });

        document.getElementById('btn-start-game').addEventListener('click', () => {
            startGameSession();
        });

        document.getElementById('btn-exit-lobby').addEventListener('click', () => {
            if (roomId && playerId) {
                remove(ref(db, `rooms/${roomId}/players/${playerId}`));
            }
            location.reload();
        });

        function joinRoom(code, isCreator) {
            roomId = code;
            let rawName = document.getElementById('player-name').value || 'Jugador';
            player.name = filterText(rawName);

            const maxP = document.getElementById('max-players').value;
            document.getElementById('display-room').innerText = roomId;
            document.getElementById('display-max').innerText = maxP;
            
            document.getElementById('lobby-overlay').style.display = 'none';
            document.getElementById('btn-exit-lobby').style.display = 'block';

            const roomRef = ref(db, `rooms/${roomId}/players`);
            const newPlayerRef = push(roomRef);
            playerId = newPlayerRef.key;

            set(newPlayerRef, {
                name: player.name,
                x: player.x,
                y: player.y,
                color: player.color
            });

            onDisconnect(newPlayerRef).remove();

            onValue(roomRef, (snapshot) => {
                remotePlayers = snapshot.val() || {};
                const totalCount = Object.keys(remotePlayers).length + Object.keys(botList).length;
                document.getElementById('player-count').innerText = totalCount;
            });

            const wantBots = document.getElementById('chk-bots').checked;
            if (isCreator && wantBots) {
                spawnBots(parseInt(maxP));
                startQuickCountdown();
            } else {
                document.getElementById('btn-start-game').style.display = 'block';
                document.getElementById('timer').innerText = "En espera";
            }

            gameLoop();
        }

        function startQuickCountdown() {
            let timeLeft = 3;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('event-banner').innerText = "¡PARTIDA INICIANDO EN BREVE!";

            startTimerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(startTimerInterval);
                    startGameSession();
                }
            }, 1000);
        }

        function spawnBots(maxPlayers) {
            const botNames = ["BotAlpha", "CyberBro", "PixelKing", "GlitchBot", "SpeedyBot"];
            const botColors = ["#ff0055", "#ffea00", "#00ffaa", "#ff00ff", "#00ffff"];
            
            for (let i = 1; i < maxPlayers; i++) {
                const bId = "bot_" + i;
                botList[bId] = {
                    name: botNames[i - 1] || ("Bot_" + i),
                    x: 150 + (i * 70),
                    y: GROUND_Y - 40,
                    velocityY: 0,
                    isGrounded: true,
                    color: botColors[i - 1] || "#fff",
                    direction: (Math.random() > 0.5 ? 1 : -1),
                    actionTimer: 0
                };
            }
        }

        function startGameSession() {
            gameStarted = true;
            document.getElementById('btn-start-game').style.display = 'none';
            document.getElementById('event-banner').innerText = "¡PARTIDA EN CURSO!";
            document.getElementById('timer').innerText = "¡Jugando!";

            if (document.getElementById('chk-chaos').checked) {
                startChaosEvents();
            }
        }

        function startChaosEvents() {
            const events = ['cube', 'laser', 'low_gravity'];
            
            chaosInterval = setInterval(() => {
                const randomEvent = events[Math.floor(Math.random() * events.length)];
                activeEvent = randomEvent;

                if (randomEvent === 'cube') {
                    document.getElementById('event-banner').innerText = "⚠️ ¡EVENTO: Cubo Gigante Expandido!";
                    cubeSize = 120;
                } else if (randomEvent === 'laser') {
                    document.getElementById('event-banner').innerText = "⚡ ¡EVENTO: Lluvia de Rayos Láser!";
                    laserX = Math.random() * canvas.width;
                } else if (randomEvent === 'low_gravity') {
                    document.getElementById('event-banner').innerText = "🚀 ¡EVENTO: Gravedad Lunar!";
                    player.gravity = 0.4;
                }

                setTimeout(() => {
                    activeEvent = null;
                    player.gravity = 1.0;
                    cubeSize = 40;
                    if(gameStarted) {
                        document.getElementById('event-banner').innerText = "¡PARTIDA EN CURSO!";
                    }
                }, 20000);

            }, 40000);
        }

        function update() {
            player.size = cubeSize;

            if (input.right) { 
                player.velocityX += player.acceleration; 
                if (player.velocityX > player.speed) player.velocityX = player.speed; 
            } else if (input.left) { 
                player.velocityX -= player.acceleration; 
                if (player.velocityX < -player.speed) player.velocityX = -player.speed; 
            } else { 
                player.velocityX *= player.friction; 
            }

            player.x += player.velocityX;

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;

            if (input.jump && player.isGrounded) { 
                player.velocityY = player.jumpForce; 
                player.isGrounded = false; 
            }

            player.velocityY += player.gravity;
            player.y += player.velocityY;

            if (player.y + player.size >= GROUND_Y) {
                player.y = GROUND_Y - player.size;
                player.velocityY = 0;
                player.isGrounded = true;
            }

            if (gameStarted) {
                Object.keys(botList).forEach(bId => {
                    let bot = botList[bId];
                    
                    bot.actionTimer++;
                    if (bot.actionTimer > Math.random() * 80 + 30) {
                        bot.actionTimer = 0;
                        const randChoice = Math.random();
                        if (randChoice < 0.4) bot.direction = 1;
                        else if (randChoice < 0.8) bot.direction = -1;
                        else bot.direction = 0;

                        if (Math.random() < 0.3 && bot.isGrounded) {
                            bot.velocityY = -18;
                            bot.isGrounded = false;
                        }
                    }

                    bot.x += bot.direction * 3;
                    if (bot.x < 50) bot.direction = 1;
                    if (bot.x > canvas.width - 100) bot.direction = -1;

                    bot.velocityY += 1.0;
                    bot.y += bot.velocityY;
                    if (bot.y + 40 >= GROUND_Y) {
                        bot.y = GROUND_Y - 40;
                        bot.velocityY = 0;
                        bot.isGrounded = true;
                    }
                });
            }

            if (roomId && playerId) {
                set(ref(db, `rooms/${roomId}/players/${playerId}`), {
                    name: player.name,
                    x: Math.floor(player.x),
                    y: Math.floor(player.y),
                    color: player.color,
                    size: player.size
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#1e0c38';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

            if (activeEvent === 'laser') {
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(laserX, 0, 15, canvas.height);
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff0055';
            } else {
                ctx.shadowBlur = 0;
            }

            const pSize = player.size || 40;
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, pSize, pSize);
            
            ctx.fillStyle = '#fff';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(player.name, player.x + (pSize / 2), player.y - 10);

            Object.keys(botList).forEach(bId => {
                const b = botList[bId];
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, 40, 40);

                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(b.name, b.x + 20, b.y - 10);
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        const bindTouch = (id, key) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); input[key] = true; });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); input[key] = false; });
            btn.addEventListener('pointerleave', () => { input[key] = false; });
            btn.addEventListener('pointercancel', () => { input[key] = false; });
        };
        
        bindTouch('btn-left', 'left'); 
        bindTouch('btn-right', 'right'); 
        bindTouch('btn-jump', 'jump');
    </script>
</body>
<html>
