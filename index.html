<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperWeb - Plataforma Profesional</title>
  <style>
    :root {
      --primary-blue: #004488;
      --accent-orange: #f39c12;
      --bg-color: #CCE0FF;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .top-bar {
      background-color: #ffffff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid var(--accent-orange);
    }

    .logo-text {
      font-size: 26px;
      font-weight: bold;
      color: var(--primary-blue);
      letter-spacing: 0.5px;
    }

    .nav-menu {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background-color: var(--accent-orange);
      color: white;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border-radius: 3px;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: #d68910;
    }

    .hero {
      background-color: var(--primary-blue);
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    .hero h1 { font-size: 32px; margin-bottom: 10px; }
    .hero p { font-size: 16px; margin-bottom: 20px; }

    .cta-btn {
      background: linear-gradient(to bottom, #9b59b6, #8e44ad);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .cta-btn:hover { opacity: 0.9; }

    .play-btn {
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 10px;
    }

    .play-btn:hover { background: #219653; }

    .content-section {
      display: none;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .content-section.active { display: block; }

    .section-title {
      font-size: 20px;
      color: var(--primary-blue);
      margin-bottom: 20px;
      border-bottom: 2px solid #99c2ff;
      padding-bottom: 8px;
      font-weight: bold;
    }

    .search-bar {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 20px;
      border: 2px solid var(--primary-blue);
      border-radius: 5px;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #cccccc;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .card h3 {
      background-color: var(--primary-blue);
      color: white;
      margin: 0;
      padding: 12px;
      font-size: 16px;
    }

    .card .card-body { padding: 15px; }
    .card p { color: #333; font-size: 14px; line-height: 1.4; margin-bottom: 15px; }

    .card-btn {
      display: inline-block;
      background-color: var(--primary-blue);
      color: white;
      text-decoration: none;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
      border: none;
      margin-right: 5px;
    }

    .card-btn.danger { background-color: #c0392b; }
    .card-btn:hover { opacity: 0.9; }

    .studio-box {
      background: white;
      padding: 30px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border: 1px solid #cccccc;
    }

    .studio-box input, .studio-box textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .code-editor {
      font-family: 'Courier New', Courier, monospace !important;
      background-color: #1e1e1e;
      color: #dcdcdc;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <div class="top-bar">
    <span class="logo-text">🚀 SUPERWEB</span>
    <div class="nav-menu">
      <button class="nav-btn active" onclick="switchTab(event, 'inicioTab')">Inicio</button>
      <button class="nav-btn" onclick="switchTab(event, 'misWebsTab')">Mis Webs</button>
      <button class="nav-btn" onclick="switchTab(event, 'studioTab')">Studio</button>
    </div>
  </div>

  <!-- PESTAÑA 1: INICIO -->
  <div id="inicioTab" class="content-section active">
    <div class="hero">
      <h1>Red Global de SuperWeb</h1>
      <p>Explora los proyectos publicados por la comunidad en la plataforma.</p>
      <button class="cta-btn" onclick="switchTab(event, 'studioTab')">¡Empieza a Crear!</button>
    </div>

    <div style="margin-top: 40px;">
      <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
        <span>Páginas Publicadas en SuperWeb</span>
        <button class="card-btn" style="background-color: #7f8c8d; font-size: 11px;" onclick="activarModoAdmin()">🔑 Modo Admin</button>
      </div>
      <input type="text" id="searchGlobal" class="search-bar" placeholder="🔍 Buscar proyectos en la red global..." oninput="filtrarRedGlobal()">
      <div class="cards-grid" id="publicWebsContainer">
        <div class="card">
          <h3>Cargando proyectos de la red...</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- PESTAÑA 2: MIS WEBS -->
  <div id="misWebsTab" class="content-section">
    <div class="section-title">Mis Páginas (Guardadas en tu Dispositivo)</div>
    <input type="text" id="searchLocal" class="search-bar" placeholder="🔍 Buscar en mis proyectos..." oninput="filtrarMisWebs()">
    <div class="cards-grid" id="misWebsContainer"></div>
  </div>

  <!-- PESTAÑA 3: STUDIO -->
  <div id="studioTab" class="content-section">
    <div class="section-title" id="studioTitle">Studio de Creación</div>
    <div class="studio-box">
      <input type="hidden" id="editIndex" value="-1">
      
      <label>Título de la Página:</label>
      <input type="text" id="webTitle" placeholder="Ej. Mi Proyecto Web">
      
      <label>Descripción:</label>
      <input type="text" id="webDesc" placeholder="Breve descripción de tu web...">

      <label><strong>Código HTML de tu Web:</strong></label>
      <textarea id="webCode" class="code-editor" rows="8" placeholder="&lt;h1&gt;Hola Mundo&lt;/h1&gt;"></textarea>
      
      <div style="display: flex; gap: 10px;">
        <button class="cta-btn" id="saveBtn" onclick="publicarYGuardar()">Publicar Proyecto</button>
        <button class="play-btn" onclick="ejecutarCodigo()">▶️ Probar / Previsualizar</button>
      </div>
    </div>
  </div>

  <!-- LÓGICA DE SUPERWEB -->
  <script>
    const BIN_ID = "6ae7b0aaac6210605a6454c6";
    const API_KEY = "$2a$10$f2EuA6ubrwz7RU8ektbbV.xBsX2vSy7MF736KP7iKiqwc3iczwc6y";
    const ADMIN_PASSWORD = "981726378476567382987364563789847567483902938765421345678293874532345678987653627346738958734954326784636675367849367485948376546783946547389984765637894875647839045698754378948576473894857647839847647839487546738945876748387654335678904569875432456789854763ewr56563w478otu66589p384u2187i94387327634897p4897434w231887876743265784953427189428907634213248934290837674321873245894590´34289021332487543"; 
    
    let esAdmin = false;
    let proyectosGlobalesCache = [];
    let proyectosLocalesCache = [];

    function switchTab(evt, tabId) {
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');

      if (tabId === 'inicioTab') cargarRedGlobal();
      if (tabId === 'misWebsTab') cargarMisWebsLocales();
    }

    function obtenerLocales() {
      const datos = localStorage.getItem('superweb_local_projects');
      return datos ? JSON.parse(datos) : [];
    }

    function cargarMisWebsLocales() {
      proyectosLocalesCache = obtenerLocales();
      renderizarMisWebs(proyectosLocalesCache);
    }

    function renderizarMisWebs(proyectos) {
      const contenedor = document.getElementById('misWebsContainer');
      if (proyectos.length === 0) {
        contenedor.innerHTML = '<p>No tienes páginas creadas o no se encontraron resultados.</p>';
        return;
      }
      contenedor.innerHTML = '';
      proyectos.forEach((proj, idx) => {
        contenedor.innerHTML += `
          <div class="card">
            <h3>${proj.title}</h3>
            <div class="card-body">
              <p>${proj.desc}</p>
              <small style="color: #666;">Fecha: ${proj.fecha}</small><br><br>
              <button class="card-btn" onclick="verWeb('${encodeURIComponent(proj.code)}')">Ver Web</button>
              <button class="card-btn" onclick="editarLocal(${idx})">Editar</button>
              <button class="card-btn danger" onclick="eliminarLocal(${idx})">Eliminar</button>
            </div>
          </div>
        `;
      });
    }

    function filtrarMisWebs() {
      const query = document.getElementById('searchLocal').value.toLowerCase();
      renderizarMisWebs(proyectosLocalesCache.filter(p => p.title.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query)));
    }

    function editarLocal(index) {
      const proj = obtenerLocales()[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('webTitle').value = proj.title;
      document.getElementById('webDesc').value = proj.desc;
      document.getElementById('webCode').value = proj.code;
      document.getElementById('studioTitle').innerText = "Studio - Editando Proyecto";
      document.getElementById('saveBtn').innerText = "Actualizar Proyecto";
      switchTab(null, 'studioTab');
    }

    function eliminarLocal(index) {
      if (confirm("¿Seguro que deseas eliminar esta página de tu dispositivo?")) {
        let proyectos = obtenerLocales();
        proyectos.splice(index, 1);
        localStorage.setItem('superweb_local_projects', JSON.stringify(proyectos));
        cargarMisWebsLocales();
      }
    }

    function limpiarFormulario() {
      document.getElementById('webTitle').value = '';
      document.getElementById('webDesc').value = '';
      document.getElementById('webCode').value = '';
      document.getElementById('editIndex').value = "-1";
      document.getElementById('studioTitle').innerText = "Studio de Creación";
      document.getElementById('saveBtn').innerText = "Publicar Proyecto";
    }

    function ejecutarCodigo() {
      const code = document.getElementById('webCode').value;
      if (!code.trim()) return alert("Escribe algo de código HTML primero.");
      const win = window.open();
      win.document.write(`
        <!DOCTYPE html>
        <html lang="es">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Previsualización - SuperWeb</title>
        </head>
        <body>
          ${code}
        </body>
        </html>
      `);
      win.document.close();
    }

    function verWeb(codigoCodificado) {
      const win = window.open();
      const codigoDecodificado = decodeURIComponent(codigoCodificado);
      win.document.write(`
        <!DOCTYPE html>
        <html lang="es">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Vista Previa - SuperWeb</title>
        </head>
        <body>
          ${codigoDecodificado}
        </body>
        </html>
      `);
      win.document.close();
    }

    async function publicarYGuardar() {
      const title = document.getElementById('webTitle').value;
      const desc = document.getElementById('webDesc').value;
      const code = document.getElementById('webCode').value;
      const editIndex = document.getElementById('editIndex').value;

      if (!title) return alert("¡Ingresa un título antes de publicar!");

      const fecha = new Date().toLocaleDateString();
      const proyectoData = { title, desc, code, fecha };

      let locales = obtenerLocales();
      if (editIndex === "-1") locales.push(proyectoData);
      else locales[editIndex] = proyectoData;
      localStorage.setItem('superweb_local_projects', JSON.stringify(locales));

      try {
        const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
        const getData = await getRes.json();
        let listaProyectos = getData.record.projects || [];
        listaProyectos.push(proyectoData);

        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify({ projects: listaProyectos })
        });

        alert('¡Proyecto guardado en tu dispositivo y publicado en la Red Global!');
        limpiarFormulario();
        switchTab(null, 'inicioTab');
      } catch (error) {
        console.error(error);
        alert('Se guardó en tu dispositivo, pero hubo un detalle de conexión con la red global.');
        limpiarFormulario();
        switchTab(null, 'misWebsTab');
      }
    }

    async function cargarRedGlobal() {
      const contenedor = document.getElementById('publicWebsContainer');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
        const data = await res.json();
        proyectosGlobalesCache = data.record.projects || [];
        renderizarRedGlobal(proyectosGlobalesCache);
      } catch (error) {
        contenedor.innerHTML = '<p>Error al cargar los datos de la red global.</p>';
      }
    }

    function renderizarRedGlobal(proyectos) {
      const contenedor = document.getElementById('publicWebsContainer');
      if (proyectos.length === 0) {
        contenedor.innerHTML = '<p>No hay proyectos compartidos en la red todavía.</p>';
        return;
      }
      contenedor.innerHTML = '';
      proyectos.forEach((proj, idx) => {
        let botonEliminarAdmin = esAdmin ? `<button class="card-btn danger" onclick="eliminarGlobal(${idx})">Eliminar (Admin)</button>` : '';
        contenedor.innerHTML += `
          <div class="card">
            <h3>${proj.title}</h3>
            <div class="card-body">
              <p>${proj.desc}</p>
              <small style="color: #666;">Publicado: ${proj.fecha}</small><br><br>
              <button class="card-btn" onclick="verWeb('${encodeURIComponent(proj.code)}')">Ver Web</button>
              ${botonEliminarAdmin}
            </div>
          </div>
        `;
      });
    }

    function filtrarRedGlobal() {
      const query = document.getElementById('searchGlobal').value.toLowerCase();
      renderizarRedGlobal(proyectosGlobalesCache.filter(p => p.title.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query)));
    }

    function activarModoAdmin() {
      if (esAdmin) return alert("Ya estás en Modo Administrador.");
      const pass = prompt("Introduce la contraseña de Administrador de SuperWeb:");
      if (pass === ADMIN_PASSWORD) {
        esAdmin = true;
        alert("¡Modo Administrador activado!");
        renderizarRedGlobal(proyectosGlobalesCache);
      } else if (pass !== null) alert("Contraseña incorrecta.");
    }

    async function eliminarGlobal(index) {
      if (confirm("¿Estás seguro de que deseas eliminar este proyecto de la Red Global?")) {
        try {
          const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
          const data = await res.json();
          let listaProyectos = data.record.projects || [];
          listaProyectos.splice(index, 1);

          await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
            body: JSON.stringify({ projects: listaProyectos })
          });

          alert("Proyecto eliminado con éxito.");
          cargarRedGlobal();
        } catch (error) {
          console.error(error);
          alert("Hubo un error al eliminar.");
        }
      }
    }

    setInterval(() => {
      if (document.getElementById('inicioTab').classList.contains('active')) cargarRedGlobal();
    }, 10000);

    window.onload = function() { cargarRedGlobal(); };
  </script>

</body>
</html>
