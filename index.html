<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperWeb - Plataforma Profesional</title>
  <style>
    :root {
      --primary-blue: #004488;
      --accent-orange: #f39c12;
      --bg-color: #CCE0FF; /* Tu mezcla de 80% blanco y 20% azul */
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    /* Barra Superior */
    .top-bar {
      background-color: #ffffff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid var(--accent-orange);
    }

    .logo-text {
      font-size: 26px;
      font-weight: bold;
      color: var(--primary-blue);
      letter-spacing: 0.5px;
    }

    .nav-menu {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background-color: var(--accent-orange);
      color: white;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border-radius: 3px;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: #d68910;
    }

    /* Hero Section */
    .hero {
      background-color: var(--primary-blue);
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    .hero h1 { font-size: 32px; margin-bottom: 10px; }
    .hero p { font-size: 16px; margin-bottom: 20px; }

    .cta-btn {
      background: linear-gradient(to bottom, #9b59b6, #8e44ad);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .cta-btn:hover { opacity: 0.9; }

    /* Contenedor de Secciones */
    .content-section {
      display: none;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .content-section.active { display: block; }

    .section-title {
      font-size: 20px;
      color: var(--primary-blue);
      margin-bottom: 20px;
      border-bottom: 2px solid #99c2ff;
      padding-bottom: 8px;
      font-weight: bold;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #cccccc;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .card h3 {
      background-color: var(--primary-blue);
      color: white;
      margin: 0;
      padding: 12px;
      font-size: 16px;
    }

    .card .card-body { padding: 15px; }
    .card p { color: #333; font-size: 14px; line-height: 1.4; margin-bottom: 15px; }

    .card-btn {
      display: inline-block;
      background-color: var(--primary-blue);
      color: white;
      text-decoration: none;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
      border: none;
      margin-right: 5px;
    }

    .card-btn.danger {
      background-color: #c0392b;
    }

    .card-btn:hover {
      opacity: 0.9;
    }

    /* Studio */
    .studio-box {
      background: white;
      padding: 30px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border: 1px solid #cccccc;
    }

    .studio-box input, .studio-box textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .code-editor {
      font-family: 'Courier New', Courier, monospace !important;
      background-color: #1e1e1e;
      color: #dcdcdc;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <div class="top-bar">
    <span class="logo-text">🚀 SUPERWEB</span>
    <div class="nav-menu">
      <button class="nav-btn active" onclick="switchTab(event, 'inicioTab')">Inicio</button>
      <button class="nav-btn" onclick="switchTab(event, 'misWebsTab')">Mis Webs</button>
      <button class="nav-btn" onclick="switchTab(event, 'studioTab')">Studio</button>
    </div>
  </div>

  <!-- PESTAÑA 1: INICIO -->
  <div id="inicioTab" class="content-section active">
    <div class="hero">
      <h1>Red Global de SuperWeb</h1>
      <p>Explora los proyectos publicados por la comunidad en la plataforma.</p>
      <button class="cta-btn" onclick="switchTab(event, 'studioTab')">¡Empieza a Crear!</button>
    </div>

    <div style="margin-top: 40px;">
      <div class="section-title">Páginas Publicadas en SuperWeb</div>
      <div class="cards-grid" id="publicWebsContainer">
        <div class="card">
          <h3>Cargando proyectos de la red...</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- PESTAÑA 2: MIS WEBS -->
  <div id="misWebsTab" class="content-section">
    <div class="section-title">Mis Páginas Creadas</div>
    <div class="cards-grid" id="misWebsContainer">
      <!-- Se cargan dinámicamente -->
    </div>
  </div>

  <!-- PESTAÑA 3: STUDIO -->
  <div id="studioTab" class="content-section">
    <div class="section-title" id="studioTitle">Studio de Creación de SuperWeb</div>
    <div class="studio-box">
      <input type="hidden" id="editIndex" value="-1">
      
      <label>Título de la Página:</label>
      <input type="text" id="webTitle" placeholder="Ej. Mi Proyecto Web">
      
      <label>Descripción:</label>
      <input type="text" id="webDesc" placeholder="Breve descripción de tu web...">

      <label><strong>Código HTML de tu Web:</strong></label>
      <textarea id="webCode" class="code-editor" rows="8" placeholder="&lt;h1&gt;Hola Mundo&lt;/h1&gt;"></textarea>
      
      <button class="cta-btn" id="saveBtn" onclick="publicarProyectoSuperWeb()">Publicar en la Red de SuperWeb</button>
    </div>
  </div>

  <script>
    // Credenciales integradas de forma interna (invisibles para el usuario final en la interfaz)
    const BIN_ID = "6ae7b0aaac6210605a6454c6";
    const API_KEY = "$2a$10$f2EuA6ubrwz7RU8ektbbV.xBsX2vSy7MF736KP7iKiqwc3iczwc6y";

    function switchTab(evt, tabId) {
      const sections = document.querySelectorAll('.content-section');
      sections.forEach(sec => sec.classList.remove('active'));

      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');

      if(tabId === 'inicioTab' || tabId === 'misWebsTab') {
        cargarWebsDeRed();
      }
    }

    // Publicar proyecto a través de la infraestructura interna de SuperWeb
    async function publicarProyectoSuperWeb() {
      const title = document.getElementById('webTitle').value;
      const desc = document.getElementById('webDesc').value;
      const code = document.getElementById('webCode').value;
      const editIndex = document.getElementById('editIndex').value;

      if(!title) {
        alert("¡Ponle un título a tu web!");
        return;
      }

      const nuevoProyecto = { title, desc, code, fecha: new Date().toLocaleDateString() };

      try {
        const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const getData = await getRes.json();
        let listaProyectos = getData.record.projects || [];

        if(editIndex === "-1") {
          listaProyectos.push(nuevoProyecto);
          alert('¡Proyecto publicado con éxito en la red de SuperWeb!');
        } else {
          listaProyectos[editIndex] = nuevoProyecto;
          alert('¡Proyecto actualizado con éxito!');
          document.getElementById('editIndex').value = "-1";
          document.getElementById('studioTitle').innerText = "Studio de Creación de SuperWeb";
          document.getElementById('saveBtn').innerText = "Publicar en la Red de SuperWeb";
        }

        const putRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify({ projects: listaProyectos })
        });

        if(putRes.ok) {
          document.getElementById('webTitle').value = '';
          document.getElementById('webDesc').value = '';
          document.getElementById('webCode').value = '';
          switchTab({ currentTarget: document.querySelectorAll('.nav-btn')[0] }, 'inicioTab');
        } else {
          alert('Hubo un error al guardar en los servidores.');
        }
      } catch (error) {
        console.error("Error:", error);
        alert('Error de conexión con la red de SuperWeb.');
      }
    }

    // Cargar proyectos de la red en la interfaz
    async function cargarWebsDeRed() {
      const inicioContenedor = document.getElementById('publicWebsContainer');
      const misWebsContenedor = document.getElementById('misWebsContainer');

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        const proyectos = data.record.projects || [];

        if(proyectos.length === 0) {
          inicioContenedor.innerHTML = '<p>No hay proyectos publicados todavía.</p>';
          misWebsContenedor.innerHTML = '<p>No has creado ningún proyecto.</p>';
          return;
        }

        // Renderizar Inicio Global
        inicioContenedor.innerHTML = '';
        proyectos.forEach(proj => {
          inicioContenedor.innerHTML += `
            <div class="card">
              <h3>${proj.title}</h3>
              <div class="card-body">
                <p>${proj.desc}</p>
                <small style="color: #666;">Publicado: ${proj.fecha}</small><br><br>
                <button class="card-btn" onclick="alert('Código:\\n${encodeURIComponent(proj.code)}')">Ver Código</button>
              </div>
            </div>
          `;
        });

        // Renderizar Mis Webs (Con opciones de gestión)
        misWebsContenedor.innerHTML = '';
        proyectos.forEach((proj, idx) => {
          misWebsContenedor.innerHTML += `
            <div class="card">
              <h3>${proj.title}</h3>
              <div class="card-body">
                <p>${proj.desc}</p>
                <small style="color: #666;">Publicado: ${proj.fecha}</small><br><br>
                <button class="card-btn" onclick="prepararEdicion(${idx}, '${encodeURIComponent(proj.title)}', '${encodeURIComponent(proj.desc)}', '${encodeURIComponent(proj.code)}')">Editar</button>
                <button class="card-btn danger" onclick="eliminarProyecto(${idx})">Eliminar</button>
              </div>
            </div>
          `;
        });
      } catch (error) {
        inicioContenedor.innerHTML = '<p>Error al sincronizar con la red de SuperWeb.</p>';
        misWebsContenedor.innerHTML = '<p>Error al sincronizar con la red de SuperWeb.</p>';
      }
    }

    function prepararEdicion(idx, title, desc, code) {
      document.getElementById('editIndex').value = idx;
      document.getElementById('webTitle').value = decodeURIComponent(title);
      document.getElementById('webDesc').value = decodeURIComponent(desc);
      document.getElementById('webCode').value = decodeURIComponent(code);

      document.getElementById('studioTitle').innerText = "Studio - Editando Proyecto";
      document.getElementById('saveBtn').innerText = "Actualizar en SuperWeb";

      switchTab({ currentTarget: document.querySelectorAll('.nav-btn')[2] }, 'studioTab');
    }

    async function eliminarProyecto(idx) {
      if(confirm("¿Estás seguro de eliminar este proyecto de la red?")) {
        try {
          const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
          });
          const data = await res.json();
          let proyectos = data.record.projects || [];

          proyectos.splice(idx, 1);

          await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': API_KEY
            },
            body: JSON.stringify({ projects: proyectos })
          });

          cargarWebsDeRed();
          alert("Proyecto eliminado con éxito.");
        } catch (error) {
          alert("Error al eliminar el proyecto.");
        }
      }
    }

    window.onload = cargarWebsDeRed;
  </script>

</body>
</html>
